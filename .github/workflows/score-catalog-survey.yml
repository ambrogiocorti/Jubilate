# Builds the PDMX score catalogue on the work branch to check its size and
# contents before it goes live (the deploy workflow builds it for main).
name: Score catalogue check (PDMX)

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-3nvi2f]
    paths: [scripts/pdmx/**, .github/workflows/score-catalog-survey.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build catalogue
        run: |
          base="https://zenodo.org/records/15571083/files"
          curl -fsSL --retry 3 -o PDMX.csv "$base/PDMX.csv?download=1"
          curl -fsSL --retry 3 -o mxl.tar.gz "$base/mxl.tar.gz?download=1"
          python3 scripts/pdmx/build_catalog.py PDMX.csv mxl.tar.gz catalogo
      - name: Report
        run: |
          python3 - <<'PY'
          import json, re, unicodedata
          d = json.load(open("catalogo/index.json"))
          items = d["items"]
          print("items", len(items))
          def n(s): return unicodedata.normalize("NFKD", s).encode("ascii","ignore").decode().lower()
          for q in ["tu scendi dalle stelle","astro del ciel","adeste fideles","o sanctissima","salve regina","tantum ergo","mira il tuo popolo","ave maria","veni creator","stille nacht"]:
              hits = [i for i in items if q in n(i["t"])]
              print(f"{q}: {len(hits)}")
              for h in hits[:4]: print("   ", h)
          PY
          du -sh catalogo; ls catalogo | head -3
