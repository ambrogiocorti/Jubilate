# Builds Jubilate and publishes it on GitHub Pages.
#
# Default address: https://<owner>.github.io/<repo>/ (free, no domain needed).
# For a custom domain set the repository variable CUSTOM_DOMAIN (e.g.
# jubilate.example.org): the app is then built for the site root and a CNAME
# file is added. Only publishable values are used here; never add secret keys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://odunxiuirkaodmbrayot.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_neCsumXqxBYrBvbG7CyTbQ_am8KyD9A' }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base path and site URL
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
            echo "VITE_SITE_URL=https://$CUSTOM_DOMAIN" >> "$GITHUB_ENV"
          else
            repo="${GITHUB_REPOSITORY#*/}"
            echo "BASE_PATH=/$repo/" >> "$GITHUB_ENV"
            echo "VITE_SITE_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/$repo" >> "$GITHUB_ENV"
          fi
      # Free sacred scores (PDMX, public domain / CC0) served next to the app,
      # so the score search needs no third-party service. Cached between runs;
      # if PDMX cannot be downloaded the app is published without it.
      - name: Restore score catalogue
        id: catalog
        uses: actions/cache@v4
        with:
          path: catalogo
          key: pdmx-catalog-${{ hashFiles('scripts/pdmx/build_catalog.py') }}
      - name: Build score catalogue (PDMX)
        if: steps.catalog.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -e
          base="https://zenodo.org/records/15571083/files"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/PDMX.csv" "$base/PDMX.csv?download=1"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mxl.tar.gz" "$base/mxl.tar.gz?download=1"
          rm -rf catalogo "$RUNNER_TEMP/catalogo"
          python3 scripts/pdmx/build_catalog.py "$RUNNER_TEMP/PDMX.csv" "$RUNNER_TEMP/mxl.tar.gz" "$RUNNER_TEMP/catalogo"
          mv "$RUNNER_TEMP/catalogo" catalogo
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Add score catalogue
        run: if [ -f catalogo/index.json ]; then cp -r catalogo dist/catalogo; else echo "::warning::Score catalogue not available"; fi
      - name: Custom domain
        if: env.CUSTOM_DOMAIN != ''
        run: echo "$CUSTOM_DOMAIN" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
