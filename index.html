<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Jubilate — La musica che unisce la comunità. Canti, accordi e spartiti per le celebrazioni." />
    <meta name="theme-color" content="#5c0a00" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jubilate" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Jubilate</title>
    <script>
      // Apply the saved theme before first paint (avoids a flash).
      try {
        var p = JSON.parse(localStorage.getItem('jubilate.prefs') || '{}');
        if (p.theme === 'dark' || p.theme === 'light') document.documentElement.dataset.theme = p.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Jubilate richiede JavaScript per funzionare.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
